name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check tag version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          version = re.search(r'project\(relay VERSION (\d+\.\d+\.\d+)', pathlib.Path('CMakeLists.txt').read_text()).group(1)
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} must match CMake version v{version}')
          PY
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download the tested build for this commit
        run: |
          run_id=$(gh run list --workflow build.yml --commit "$RELEASE_COMMIT" --branch main --limit 50 \
            --json databaseId,event,status,conclusion \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | (map(select(.conclusion == "success"))[0] // .[0]) | .databaseId // empty')
          if [ -z "$run_id" ]; then
            echo 'No build for this commit. Push it to main and run Build, then rerun this release.' >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 10
          gh run download "$run_id" --name "relay-windows-x64-$RELEASE_COMMIT" --dir dist

      - name: Verify release files
        run: |
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          version = os.environ['RELEASE_TAG'][1:]
          info = json.loads(pathlib.Path('dist/build-info.json').read_text())
          if info != {'version': version, 'commit': os.environ['RELEASE_COMMIT']}:
              raise SystemExit('Build metadata does not match the tag commit and version')
          with zipfile.ZipFile(f'dist/relay-{version}-windows-x64.zip') as archive:
              files = set(archive.namelist())
              required = {'relay.exe', 'version.txt', 'LICENSE', 'assets/NotoSansMono-Medium.ttf',
                          'assets/OFL.txt', 'plugins/calc.lua', 'plugins/web.lua',
                          'licenses/imgui.txt', 'licenses/lua.txt', 'licenses/sol2.txt',
                          'vcruntime140.dll', 'msvcp140.dll'}
              if not required <= files:
                  raise SystemExit(f'Release is missing required files: {required - files}')
              if archive.read('version.txt').decode().strip() != version:
                  raise SystemExit('Packaged version does not match the tag')
              if any(p.startswith(('docs/', 'tests/', '.git/')) or p.endswith('_test.exe') for p in files):
                  raise SystemExit('Release contains development files')
          PY
          cd dist
          sha256sum --check "relay-${RELEASE_TAG#v}-windows-x64.zip.sha256"

      - name: Publish GitHub release
        run: |
          cat > release-notes.md <<'EOF'
          Download the Windows x64 ZIP, extract it, and run `relay.exe`. Keep the extracted files together, then press **Alt+Space**.

          Settings and launch history live in `%APPDATA%/relay`. This portable release includes the Visual C++ runtime. The `.sha256` file contains the ZIP's SHA-256 checksum.
          EOF
          gh release create "$RELEASE_TAG" \
            "dist/relay-${RELEASE_TAG#v}-windows-x64.zip" \
            "dist/relay-${RELEASE_TAG#v}-windows-x64.zip.sha256" \
            --verify-tag --title "Relay $RELEASE_TAG" --notes-file release-notes.md --generate-notes
