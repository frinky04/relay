name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check tag version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          version = re.search(r'project\(relay VERSION (\d+\.\d+\.\d+)', pathlib.Path('CMakeLists.txt').read_text()).group(1)
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} must match CMake version v{version}')
          PY
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download the tested build for this commit
        run: |
          run_id=$(gh run list --workflow build.yml --commit "$RELEASE_COMMIT" --branch main --limit 50 \
            --json databaseId,event,status,conclusion \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")] | (map(select(.conclusion == "success"))[0] // .[0]) | .databaseId // empty')
          if [ -z "$run_id" ]; then
            echo 'No build for this commit. Push it to main and run Build, then rerun this release.' >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 10
          gh run download "$run_id" --name "relay-windows-x64-$RELEASE_COMMIT" --dir dist

      - name: Verify release files
        run: python3 scripts/verify_release.py dist "${RELEASE_TAG#v}" "$RELEASE_COMMIT"

      - name: Publish GitHub release
        run: |
          cat > release-notes.md <<'EOF'
          Download `frinky04.Relay-win-Setup.exe` to install Relay for your Windows account. For portable use, extract `frinky04.Relay-win-Portable.zip` and run `Relay.exe` in its top folder. Press **Alt+Space** to open Relay.

          Relay downloads updates in the background on startup and applies them on the next restart. Use `/relay Check for Updates` to check now and `/relay Restart to Update` to apply a ready update.

          Set `start_with_windows = true` in `%APPDATA%/relay/init.lua` to start Relay hidden when you sign in. Settings, user plugins, and launch history remain in `%APPDATA%/relay` across updates.

          Users upgrading from v0.1.0 need to quit the old copy and install this release once. `SHA256SUMS` contains checksums for all release files.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/frinky04.Relay-win-Setup.exe dist/frinky04.Relay-win-Portable.zip \
            "dist/frinky04.Relay-${RELEASE_TAG#v}-full.nupkg" \
            dist/releases.win.json dist/RELEASES dist/assets.win.json dist/SHA256SUMS \
            --draft --verify-tag --title "Relay $RELEASE_TAG" --notes-file release-notes.md --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
