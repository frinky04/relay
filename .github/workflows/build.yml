name: Build and Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Read build settings
        id: settings
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json -AsHashtable
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(relay VERSION (\d+\.\d+\.\d+)').Groups[1].Value
          if (!$version -or $manifest['version-string'] -ne $version) {
              throw 'CMake and vcpkg versions must match'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME must match CMake version v$version"
          }
          "baseline=$($manifest.'builtin-baseline')" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          # App releases do not change the dependency binaries.
          $manifest.Remove('version-string')
          $dependencyBytes = [Text.Encoding]::UTF8.GetBytes(($manifest | ConvertTo-Json -Depth 100 -Compress))
          $dependencyHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($dependencyBytes)).ToLowerInvariant()
          "dependencies=$dependencyHash" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/vcpkg-cache" -Force | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP\vcpkg-cache,readwrite" >> $env:GITHUB_ENV

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-vs2026-${{ steps.settings.outputs.image }}-${{ steps.settings.outputs.dependencies }}-${{ hashFiles('CMakePresets.json') }}
          restore-keys: |
            vcpkg-vs2026-${{ steps.settings.outputs.image }}-
            vcpkg-vs2026-

      - name: Check out pinned vcpkg
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.settings.outputs.baseline }}
          path: .vcpkg
          persist-credentials: false

      - name: Cache Velopack SDK and packaging tool
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/ci/_deps
            build/ci/vpk
          key: velopack-windows-x64-${{ hashFiles('cmake/Velopack.cmake') }}

      - name: Bootstrap vcpkg
        run: ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure release dependencies
        # SDK/tool versions are pinned together by cmake/Velopack.cmake.
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --parallel

      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure --timeout 30

      - name: Package and verify installer and updates
        if: github.event_name != 'pull_request'
        run: ./scripts/package.ps1 -BuildDir build/ci -OutputDir dist/release

      - name: Keep tested release files
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relay-windows-x64-${{ github.sha }}
          path: dist/release/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Download `frinky04.Relay-win-Setup.exe` to install Relay for your Windows account. For portable use, extract `frinky04.Relay-win-Portable.zip` and run `Relay.exe` in its top folder. Press **Alt+Space** to open Relay.

          Relay downloads updates in the background on startup and applies them on the next restart. Use `/relay Check for Updates` to check now and `/relay Restart to Update` to apply a ready update.

          Set `start_with_windows = true` in `%APPDATA%/relay/init.lua` to start Relay hidden when you sign in. Settings, user plugins, and launch history remain in `%APPDATA%/relay` across updates.

          Users upgrading from v0.1.0 need to quit the old copy and install this release once. `SHA256SUMS` contains checksums for all release files.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/release/frinky04.Relay-win-Setup.exe dist/release/frinky04.Relay-win-Portable.zip \
            "dist/release/frinky04.Relay-${RELEASE_TAG#v}-full.nupkg" \
            dist/release/releases.win.json dist/release/RELEASES dist/release/assets.win.json dist/release/SHA256SUMS \
            --draft --verify-tag --title "Relay $RELEASE_TAG" --notes-file release-notes.md --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
